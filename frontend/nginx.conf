server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This is the critical part for React Router.
    # Without it, refreshing on /dashboard returns a 404 because
    # nginx looks for a real file at that path and finds nothing.
    # try_files falls back to index.html and lets React Router handle routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively — Vite fingerprints filenames
    # so stale cache is never an issue
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}